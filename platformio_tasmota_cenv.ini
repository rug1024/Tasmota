; ESP32-S3 Mini, 4 MB flash, 2 MB Quad-SPI PSRAM
[env:tasmota32s3-inmp441]
extends = env:tasmota32s3
board = esp32s3-qio_qspi
build_flags = ${env:tasmota32_base.build_flags}
              -DFIRMWARE_TASMOTA32
              -DUSE_I2S
              -DUSE_I2S_AUDIO
              -DUSE_I2S_MIC
              -DUSE_SHINE
              -DMP3_MIC_STREAM
              -DUSE_I2S_MIC_ONLY
lib_extra_dirs = ${env:tasmota32_base.lib_extra_dirs}
                 lib/lib_audio
