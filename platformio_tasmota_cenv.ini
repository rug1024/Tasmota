; ESP32-C5 Wi-Fi 6 Kit, N16R8 (16 MB Quad-SPI flash, 8 MB Quad-SPI PSRAM)
[esp32c5_n16r8]
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/esp32_partition_app3904k_fs11456k.csv

[env:tasmota32c5-n16r8-safeboot]
extends = env:tasmota32c5-safeboot
board_upload.flash_size = ${esp32c5_n16r8.board_upload.flash_size}
board_upload.maximum_size = ${esp32c5_n16r8.board_upload.maximum_size}
board_build.partitions = ${esp32c5_n16r8.board_build.partitions}

[env:tasmota32c5-n16r8]
extends = env:tasmota32c5
board_upload.flash_size = ${esp32c5_n16r8.board_upload.flash_size}
board_upload.maximum_size = ${esp32c5_n16r8.board_upload.maximum_size}
board_build.partitions = ${esp32c5_n16r8.board_build.partitions}
build_flags = ${env:tasmota32_base.build_flags}
              -DFIRMWARE_TASMOTA32
              -DBOARD_HAS_PSRAM
custom_sdkconfig =
              CONFIG_SPIRAM=y
              CONFIG_SPIRAM_MODE_QUAD=y
              CONFIG_SPIRAM_SPEED_80M=y
              CONFIG_SPIRAM_BOOT_INIT=y
              CONFIG_SPIRAM_USE_MALLOC=y
